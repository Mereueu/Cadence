name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.CADENCE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Signing key missing. Add the CADENCE_KEYSTORE_BASE64 and CADENCE_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cadence.jks"
          echo "CADENCE_KEYSTORE=$RUNNER_TEMP/cadence.jks" >> "$GITHUB_ENV"

      - name: Fetch MilkDrop visualizer (Butterchurn, MIT)
        run: |
          set -e
          mkdir -p /tmp/bc && cd /tmp/bc
          npm init -y > /dev/null
          npm install --no-audit --no-fund butterchurn@2 butterchurn-presets@2
          dest="$GITHUB_WORKSPACE/app/src/main/assets/milkdrop/lib"
          mkdir -p "$dest"
          main=$(ls node_modules/butterchurn/lib/butterchurn.min.js 2>/dev/null || find node_modules/butterchurn -name 'butterchurn*.min.js' | head -1)
          cp "$main" "$dest/butterchurn.min.js"
          for f in node_modules/butterchurn-presets/lib/*.min.js; do cp "$f" "$dest/"; done
          cp node_modules/butterchurn/LICENSE "$dest/LICENSE-butterchurn.txt" 2>/dev/null || true
          cp node_modules/butterchurn-presets/LICENSE "$dest/LICENSE-butterchurn-presets.txt" 2>/dev/null || true
          files=$(cd "$dest" && ls *.min.js | sed 's/.*/"&"/' | paste -sd, -)
          echo "window.MILK_FILES=[$files];" > "$dest/files.js"
          v1=$(node -p "require('./node_modules/butterchurn/package.json').version")
          v2=$(node -p "const p=require('./node_modules/butterchurn-presets/package.json'); p.version+' '+p.license")
          echo "::notice title=MilkDrop::butterchurn $v1 | presets $v2 | files $files"
          echo "::notice title=MilkDrop API::audioLevels=$(grep -o audioLevels "$dest/butterchurn.min.js" | wc -l) updateAudio=$(grep -o updateAudio "$dest/butterchurn.min.js" | wc -l) size=$(du -sh "$dest" | cut -f1)"

      - name: Build release APK
        env:
          CADENCE_KEYSTORE_PASSWORD: ${{ secrets.CADENCE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          errs=$(grep -E "^e: |^w: .*(error)" build.log | head -80 | sed "s|file://$GITHUB_WORKSPACE/||g" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$errs" ] && echo "::error title=Kotlin errors::$errs"
          wrong=$(grep -A12 "What went wrong" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          [ -n "$wrong" ] && echo "::error title=Gradle::$wrong"
          true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Cadence-${{ github.run_number }}.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-apk
          path: Cadence-${{ github.run_number }}.apk

      - name: Publish as a GitHub release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cadence build ${{ github.run_number }}
          body: Install the APK below on your Android phone (allow installs from your browser when asked).
          files: Cadence-${{ github.run_number }}.apk
